<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Live</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Quiz Live</h1>
  <p class="sous-titre">Réponds à un sondage depuis ton téléphone et vois les résultats en direct.</p>

  <div class="carte">
    <h2>Rejoindre un sondage</h2>
    <label for="code">Code à 4 chiffres</label>
    <input type="text" id="code" inputmode="numeric" maxlength="4" placeholder="4821">
    <button id="rejoindre">Rejoindre</button>
  </div>

  <div class="carte">
    <h2>Animer un sondage</h2>
    <a class="bouton" href="creer.html">Créer un sondage</a>
  </div>
</main>
<script>
  const champ = document.getElementById("code");
  function rejoindre() {
    const code = champ.value.trim();
    if (code) window.location = "vote.html?code=" + encodeURIComponent(code);
  }
  document.getElementById("rejoindre").addEventListener("click", rejoindre);
  champ.addEventListener("keydown", (e) => { if (e.key === "Enter") rejoindre(); });
</script>
</body>
</html>

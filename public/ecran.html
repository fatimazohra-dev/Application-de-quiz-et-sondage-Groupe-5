<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Résultats en direct</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
<main>
  <p class="petit" id="adresse"></p>
  <p class="code" id="code"></p>
  <h1 id="question">Chargement…</h1>
  <p class="sous-titre" id="total"></p>
  <div id="resultats"></div>
  <p class="erreur" id="erreur"></p>
  <p class="petit" id="pod"></p>
</main>
<script>
  const code = new URLSearchParams(location.search).get("code");
  document.getElementById("code").textContent = code;
  document.getElementById("adresse").textContent =
    "Rejoins sur " + location.host + " avec le code :";

  const socket = io({ transports: ["websocket"] });
  socket.on("connect", () => socket.emit("rejoindre-ecran", code));
  socket.on("pod", (nom) => { document.getElementById("pod").textContent = "Serveur : " + nom; });
  socket.on("erreur", (msg) => { document.getElementById("erreur").textContent = msg; });

  socket.on("resultats", (r) => {
    document.getElementById("question").textContent = r.question;
    document.getElementById("total").textContent = r.total + " vote(s)";
    const zone = document.getElementById("resultats");
    zone.textContent = "";
    r.options.forEach((o) => {
      const pct = r.total ? Math.round((o.votes / r.total) * 100) : 0;
      const ligne = document.createElement("div");
      ligne.className = "ligne";
      const titre = document.createElement("div");
      titre.className = "titre";
      const nom = document.createElement("span");
      nom.textContent = o.texte;
      const val = document.createElement("span");
      val.textContent = o.votes + " (" + pct + " %)";
      titre.append(nom, val);
      const piste = document.createElement("div");
      piste.className = "piste";
      const barre = document.createElement("div");
      barre.className = "barre";
      barre.style.width = pct + "%";
      piste.appendChild(barre);
      ligne.append(titre, piste);
      zone.appendChild(ligne);
    });
  });
</script>
</body>
</html>

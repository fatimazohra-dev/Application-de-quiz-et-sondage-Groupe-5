# Optionnel (étape suivante) : affinité de session par cookie via l'Ingress Nginx
# Prérequis : minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quiz-live
  annotations:
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "quiz-pod"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: quiz.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quiz-live
                port:
                  number: 80
